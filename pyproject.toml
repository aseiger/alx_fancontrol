[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alx-fancontrol"
version = "0.1.0"
description = "TUI-first fan control daemon: hwmon + nvidia-smi sources, piecewise-linear curves"
requires-python = ">=3.11"
dependencies = []                     # daemon is pure stdlib

[project.optional-dependencies]
tui  = ["textual>=1.0"]
test = ["pytest>=7"]

[project.scripts]
alx-fancontrol = "alx_fancontrol.cli:main"

[tool.setuptools.packages.find]
include = ["alx_fancontrol*"]
